# open ..miniconda3\..\Lib\site-packages\constructor\nsis folder 
# open main.nsi.tmpl file comment these lines 
# !define MUI_HEADERIMAGE
# !define MUI_HEADERIMAGE_BITMAP {{ headerimage }}
# !define MUI_HEADERIMAGE_UNBITMAP {{ headerimage }}
# !define MUI_WELCOMEFINISHPAGE_BITMAP {{ welcomeimage }}
# !define MUI_UNWELCOMEFINISHPAGE_BITMAP {{ welcomeimage }}
#  this will remove the default welcome and header images from the installer.

name: "osdagbridge"
version: "1.0.0"
company: osdagbridge, FOSSEE
uninstall_name: ${NAME}
installer_type: exe # [win]
installer_type: sh  # [linux]

icon_image: logo-3psLCCA.ico # [win]
icon_image: logo-3psLCCA.png # [linux]
welcome_text: |
  Welcome to the OsdagBridge GUI Installer.
  This will install OsdagBridge with all required runtime components.

# license_file: license.txt
extra_files:
  - post_install.bat  # [win]
  - pre_uninstall.bat # [win]
  - launch_osdagbridge.vbs  # [win]
  - post_install.sh   # [linux]
  - Uninstall-osdagbridge.sh  # [linux]
  - logo-3psLCCA.ico    # [win]
  - logo-3psLCCA.png    # [linux]
  - create_shortcuts.ps1  # [win]
  - remove_shortcuts.ps1  # [win]



channels:
  - conda-forge
  - osdag
  - geompy
  - zehen-249

specs:
  - zehen-249::osdagbridge=1.0.0

# Add in system env variables
initialize_conda: false
register_python: false

# Set Default installation location
default_prefix: "%LOCALAPPDATA%\\osdagbridge" # [win]
default_prefix_all_users: "%ProgramData%\\osdagbridge" # [win]
default_prefix: "$HOME/osdagbridge"  # [linux]
default_prefix_all_users: "/opt/osdagbridge"  # [linux]


post_install: post_install.bat  # [win]
pre_uninstall: pre_uninstall.bat  # [win]
post_install: post_install.sh   # [linux]

post_install_desc: |
 This will create shortcuts for OsdagBridge and add it to the start menu. You can also launch OsdagBridge from the desktop shortcut.(Recommended)


conclusion_text: |
  OsdagBridge has been successfully installed.
  You can launch OsdagBridge from the start menu or desktop shortcut. To uninstall OsdagBridge, please go to the Control Panel and remove it from the list of installed programs.